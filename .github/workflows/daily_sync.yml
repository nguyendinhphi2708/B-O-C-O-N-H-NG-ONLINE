name: Tự động cập nhật giá sữa AVAKids

on:
  schedule:
    # 22:00 UTC = 05:00 sáng giờ Việt Nam
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện và Playwright Chromium
        run: |
          pip install playwright gspread google-auth
          playwright install chromium --with-deps

      - name: Chạy script cập nhật Sheets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python .github/workflows/sync_avakids.py
